name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Descargar sidecars (yt-dlp, FFmpeg, Deno)
        run: npm run sidecars
      - name: Compilar instalador NSIS
        run: npm run tauri build
      - name: Publicar release con el instalador
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
      - name: Subir instalador como artefacto (ejecución manual)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: JpkkenVideker-instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
